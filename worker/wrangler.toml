name = "washu-sim-intel"
main = "src/index.ts"
compatibility_date = "2026-06-04"
workers_dev = false

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
# Optional explicit provider configuration. When omitted, OPENAI_API_KEY takes
# precedence and GEMINI_API_KEY is used as the fallback.
# AI_PROVIDER = "openai"
# AI_MODEL = "gpt-5.4-mini"
# AI_LIGHTWEIGHT_MODEL = "gpt-5.4-mini"

[[d1_databases]]
binding = "DB"
database_name = "washu_sim_db"
database_id = "51d29c82-d58d-46b0-8695-d08690ed669a"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "c33f40661cf9465bb2e9ef4e88396f01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "washu-sim-intel-storage-2026"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "sim_search"

# Commands to remember:
# npx wrangler d1 create washu_sim_db
# npx wrangler d1 execute washu_sim_db --file=./schema.sql
# npx wrangler dev
# npx wrangler deploy
